[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "../data" }]

[profile.ci]
fuzz = { runs = 512 }

[invariant]
runs = 256
depth = 64
fail_on_revert = true
